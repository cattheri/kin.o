<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="../styles/style-registration.css">
</head>

<body>
    <header>
        <a href="../index.html"><img class="close" src="../assets/close.svg"></a>
    </header>
    <main class="main">
        <div class="div-reg">
            <div>
                <img class="banner" src="../assets/banner.png">
            </div>
            <div>
                <div>
                    <div class="logo">kin.o</div>
                    <p>Создать аккаунт</p>
                </div>
                <div class="regis">
                    <input type="text" id="reg-fio" placeholder="ФИО">
                    <input type="email" id="reg-email" placeholder="Email">
                    <input type="text" id="reg-login" placeholder="Логин">
                    <input type="password" id="reg-password" placeholder="Пароль">
                    <input type="password" id="reg-password2" placeholder="Повторите пароль">
                    <button class="btn-confirm" id="reg-btn">Подтвердить</button>
                    <div class="div-sign">
                        <p>Уже есть аккаунт?</p>
                        <a href="../pages/auth.html"><button class="btn-sign">Войти</button></a>
                    </div>
                </div>

            </div>
        </div>

    </main>
    <footer>
        <div class="text-footer">
            <div>
                <p class="p-footer">Соглашение</p>
                <p class="p-footer"> Правила рекомендаций</p>
                <p class="p-footer"> Справка</p>
                <p class="p-footer">© 2026, kin.o</p>
            </div>
        </div>
    </footer>
    <script src="../scripts/regis.js"></script>
</body>

</html>
